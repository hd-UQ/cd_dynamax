program: l63_nn.py  # <-- point to your script
project: l63-nn-time-regularity
entity: mattlevine22
method: grid   # or "random"
metric:
  name: learned/neg_log_joint
  goal: minimize

parameters:
  seed:
    values: [0, 1]
  num_epochs:
    values: [10000]
  emission_dim:
    values: [1, 3]
  t_regular:
    values: [0, 1]  # 0 for False (uniform random sampling), 1 for True (regular sampling)
  filter_type:
    values: ["EnKF", "EKF", "UKF"]
  state_order:
    values: ["discrete", "zeroth", "first"]
  init_lr:
    values: [0.01, 0.005, 0.001]
  dt:
    values: [0.1, 0.01, 0.05]