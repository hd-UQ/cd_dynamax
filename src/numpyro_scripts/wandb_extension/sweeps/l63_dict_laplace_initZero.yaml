program: l63_dict_laplace_init_zero.py  # <-- point to your script
project: l63-dict-learning-init-zero-x64
entity: mattlevine22
method: grid   # or "random"
metric:
  name: learned/neg_log_joint
  goal: minimize

parameters:
  diffusion_coeff:
    values: [1.0, 1e-1, 1e-2]
  T:
    values: [40, 100]
  dt:
    values: [1e-2, 1e-3, 1e-1]
  diffeqsolve_max_steps:
    values: [100, 1000]
  init_lr:
    values: [1e-2, 1e-1, 1e-3]
  seed:
    values: [0, 1]
  num_epochs:
    values: [500]
