name: cd_dynamax-2025-2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Optional extras managed by conda (faster, stable builds)
  - jupyterlab>=4.2
  - ipywidgets>=8.1
  - pytest>=8.0
  - graphviz   # conda installs system-level graphviz binaries
  - pip:
      - -e .   # install this repo in editable mode, pulls deps from pyproject.toml
