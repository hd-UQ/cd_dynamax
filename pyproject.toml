[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cd_dynamax"
version = "0.2.6"
description = "Continuous-discrete dynamical systems with JAX, NumPyro, and related libraries."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10",
    "tqdm>=4.66",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "numpyro==0.19.0",
    "optax>=0.2.2",
    "equinox>=0.13",
    "diffrax==0.6.2",
    "lineax>=0.0.8",
    "flax>=0.11",
    "blackjax>=1.2",
    "jaxopt>=0.8",
    "chex>=0.1.88",
    "distrax>=0.1.3",
    "orbax-checkpoint>=0.9",
    "etils>=1.5",
    "dm-tree>=0.1.8",
    "graphviz",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cd_dynamax*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
