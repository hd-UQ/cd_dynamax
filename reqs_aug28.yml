name: cd_dynamax-2025
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core scientific stack via conda (fast, compatible)
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2
  - scikit-learn>=1.5
  - matplotlib>=3.9
  - seaborn>=0.13
  - pillow>=10
  - jupyterlab>=4.2
  - ipywidgets>=8.1
  - tqdm>=4.66
  - pip
  # (optional but handy)
  - graphviz
  - python-graphviz

  # Install JAX-family via pip to avoid conda pinning issues
  - pip:
      - jax==0.6.2
      - jaxlib==0.6.2
      - numpyro==0.19.0
      - optax>=0.2.2
      - equinox>=0.13
      - diffrax==0.6.2
      - lineax>=0.0.8
      - flax>=0.11
      - blackjax>=1.2
      - jaxopt>=0.8
      - chex>=0.1.88
      - distrax>=0.1.3
      - orbax-checkpoint>=0.9
      - etils>=1.5
      - dm-tree>=0.1.8
      - wandb>=0.17
